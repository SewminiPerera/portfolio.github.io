<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinithi Sewmini Perera - Curriculum Vitae</title>
    <meta name="description" content="CV of Dinithi Sewmini Perera – ICT Undergraduate, Web Developer & UI/UX Designer at Rajarata University of Sri Lanka.">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .pdf-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .pdf-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .pdf-header h2 {
            font-size: 24px;
            flex: 1;
            min-width: 250px;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .pdf-viewer {
            width: 100%;
            height: 700px;
            border: none;
        }
        
        @media (max-width: 768px) {
            .pdf-viewer {
                height: 500px;
            }
            
            .pdf-header {
                flex-direction: column;
                text-align: center;
            }
            
            .pdf-header h2 {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="pdf-container">
        <div class="pdf-header">
            <h2>My Curriculum Vitae</h2>
            <a href="./My CV New.pdf" download="Dinithi Sewmini CV.pdf" class="download-btn">
                <i class='bx bx-download'></i> Download PDF
            </a>
        </div>
        <iframe class="pdf-viewer" src="./My CV New.pdf"></iframe>
    </div>
</body>

</html>
